<style>
  :root {
    --bg-1: #0b0f1f;
    --bg-2: #131a35;
    --bg-3: #0d1230;
    --panel: rgba(20, 26, 51, 0.72);
    --panel-border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.25);
    --text: #eef1fb;
    --text-dim: #9aa3c7;
    --accent: #7c9bff;
    --accent-2: #5468e8;
    --surface: rgba(255, 255, 255, 0.05);
    --surface-2: rgba(255, 255, 255, 0.03);
    --surface-focus: rgba(124, 155, 255, 0.08);
    --scrollbar-thumb: rgba(255, 255, 255, 0.15);
    --overlay-bg: rgba(6, 8, 18, 0.6);
    --modal-grad-1: #161d3d;
    --modal-grad-2: #101530;
    --modal-shadow: rgba(0, 0, 0, 0.6);
    --accent-glow-1: rgba(124, 155, 255, 0.12);
    --accent-glow-2: rgba(255, 100, 130, 0.10);
  }
  html.light {
    --bg-1: #eef1fb;
    --bg-2: #dce3f5;
    --bg-3: #cfd8ee;
    --panel: rgba(255, 255, 255, 0.75);
    --panel-border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.22);
    --text: #171b2e;
    --text-dim: #5b6485;
    --accent: #4f6df0;
    --accent-2: #3d57d6;
    --surface: rgba(15, 23, 42, 0.045);
    --surface-2: rgba(15, 23, 42, 0.03);
    --surface-focus: rgba(79, 109, 240, 0.09);
    --scrollbar-thumb: rgba(15, 23, 42, 0.18);
    --overlay-bg: rgba(30, 35, 60, 0.35);
    --modal-grad-1: #ffffff;
    --modal-grad-2: #eef1fb;
    --modal-shadow: rgba(30, 40, 80, 0.25);
    --accent-glow-1: rgba(79, 109, 240, 0.10);
    --accent-glow-2: rgba(255, 100, 130, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 20%, var(--accent-glow-1), transparent 40%),
      radial-gradient(circle at 85% 75%, var(--accent-glow-2), transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3) 100%);
    transition: background .2s ease, color .2s ease;
  }
  #root { height: 100vh; width: 100vw; position: relative; }

  .app { height: 100%; width: 100%; display: flex; flex-direction: column; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    z-index: 20;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 34px; height: 34px; flex-shrink: 0; filter: drop-shadow(0 2px 8px rgba(0,0,0,.35)); }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  .brand span { font-size: 12px; color: var(--text-dim); display:block; margin-top:2px; }

  .toolbar-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .sort-tabs {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    z-index: 15;
    flex-wrap: wrap;
  }
  .sort-tab {
    display: flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid transparent;
    border-radius: 10px; padding: 7px 14px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-dim); cursor: pointer;
    white-space: nowrap;
  }
  .sort-tab svg { width: 15px; height: 15px; }
  .sort-tab:hover { border-color: var(--panel-border); color: var(--text); }
  .sort-tab.active {
    background: var(--surface-focus); border-color: var(--accent); color: var(--accent);
  }
  .sort-tab-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 800;
  }
  .reset-tab { margin-inline-start: auto; }

  .stats-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: var(--surface);
    color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .stats-toggle-btn:hover { border-color: var(--accent); }
  .stats-toggle-btn svg { width: 18px; height: 18px; }

  .stats-drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(6,8,18,.45);
    z-index: 60;
    animation: fadeIn .15s ease;
  }
  .stats-drawer {
    position: fixed; top: 0; bottom: 0;
    inset-inline-end: 0;
    width: min(300px, 85vw);
    background: linear-gradient(180deg, var(--modal-grad-1), var(--modal-grad-2));
    border-inline-start: 1px solid var(--panel-border);
    box-shadow: -20px 0 50px -20px rgba(0,0,0,.5);
    padding: 22px 20px;
    overflow-y: auto;
    z-index: 61;
  }
  .stats-drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .stats-drawer-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 800; color: var(--accent);
  }
  .stats-drawer-title svg { width: 18px; height: 18px; }
  .stats-drawer-close {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .stats-drawer-close:hover { color: var(--text); background: var(--surface); }
  .stats-card {
    background: var(--surface); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
  }
  .stats-card-label { font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }
  .stats-card-row { display: flex; align-items: baseline; justify-content: space-between; }
  .stats-card-points { font-size: 22px; font-weight: 900; color: var(--text); }
  .stats-card-points small { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .stats-card-count { font-size: 12.5px; color: var(--text-dim); }
  .stats-card-count b { color: var(--text); font-weight: 800; }

  .toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-dim); cursor: pointer;
    user-select: none;
    padding: 6px 10px; border-radius: 10px;
    border: 1px solid transparent;
  }
  .toggle:hover { border-color: var(--panel-border); color: var(--text); }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  .theme-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle svg { width: 18px; height: 18px; }

  .lang-toggle {
    display: flex; align-items: center; justify-content: center;
    min-width: 44px; height: 38px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit; font-size: 13px; font-weight: 700;
    transition: border-color .15s ease, background .15s ease;
  }
  .lang-toggle:hover { border-color: var(--accent); }

  .btn-primary {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #7c9bff, #5468e8);
    color: #fff; border: none; border-radius: 12px;
    padding: 10px 18px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 18px -4px rgba(90, 110, 255, 0.6);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px -4px rgba(90,110,255,.75); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    color: var(--text); border: 1.5px solid var(--panel-border); border-radius: 12px;
    padding: 9px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  .btn-secondary:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn-secondary:active { transform: translateY(0); }

  .legend { display:flex; gap:14px; align-items:center; flex-wrap: wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-dim); }
  .legend-swatch { width:11px; height:11px; border-radius:50%; display:inline-block; }

  /* ---------- Bubble field ---------- */
  .field-wrap {
    position: relative;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .bubble-canvas {
    position: relative;
    width: 100%;
  }
  .empty-state {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--text-dim); pointer-events: none;
    text-align: center;
  }
  .empty-state b { color: var(--text); font-size: 17px; font-weight: 700; }

  .axis-hint-top, .axis-hint-bottom {
    position: sticky;
    inset-inline-end: 14px;
    float: inline-end;
    width: fit-content;
    font-size: 11px; color: var(--text-dim); opacity: .55;
    pointer-events: none; text-align: end;
    z-index: 2;
  }
  .axis-hint-top { top: 10px; }
  .axis-hint-bottom { bottom: 10px; }

  .today-line {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px dashed var(--accent);
    z-index: 3;
    pointer-events: none;
  }
  .today-line-label {
    position: absolute;
    top: -10px;
    inset-inline-start: 14px;
    background: var(--bg-2);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    white-space: nowrap;
  }
  .tomorrow-line { border-top-color: var(--text-dim); opacity: .7; }
  .tomorrow-line-label { color: var(--text-dim); border-color: var(--text-dim); }

  .bubble {
    position: absolute;
    top: 0; left: 0;
    will-change: transform;
  }
  .bubble:hover { z-index: 5; }
  .bubble-inner {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    cursor: grab;
    touch-action: none;
    color: #101426;
    font-weight: 700;
    padding: 6px;
    user-select: none;
    transition: box-shadow .2s ease, filter .2s ease;
  }
  .bubble-inner:active { cursor: grabbing; }
  .bubble-inner:hover { filter: brightness(1.08); }
  .bubble-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    max-width: 100%;
    color: #12162b;
  }
  .bubble-title {
    font-size: 13px;
    font-weight: 800;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-shadow: 0 1px 0 rgba(255,255,255,.25);
  }
  .bubble-meta {
    font-size: 10.5px;
    font-weight: 600;
    opacity: .75;
    white-space: nowrap;
  }
  .bubble-inner.completed .bubble-label,
  .bubble-inner.completed .bubble-title,
  .bubble-inner.completed .bubble-meta { color: #1f7a3e; text-shadow: none; }

  .bubble-inner.overdue-ring::after {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.96); opacity: .7; }
    50% { transform: scale(1.04); opacity: .15; }
    100% { transform: scale(0.96); opacity: .7; }
  }

  @keyframes bubblePop {
    0% { transform: scale(1); opacity: 1; }
    35% { transform: scale(1.22); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .bubble-inner.popping {
    animation: bubblePop 380ms ease-in forwards;
    pointer-events: none;
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: var(--overlay-bg);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    width: min(460px, 92vw);
    max-height: 88vh;
    overflow-y: auto;
    background: linear-gradient(180deg, var(--modal-grad-1), var(--modal-grad-2));
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 22px 22px 20px;
    box-shadow: 0 30px 60px -20px var(--modal-shadow);
  }
  .modal h2 { margin: 0 0 16px; font-size: 18px; }
  .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .field input, .field textarea, .field select {
    background: var(--surface);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent);
    background: var(--surface-focus);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; margin-bottom: 0; }
  .field-hint { font-size: 11.5px; color: var(--text-dim); }

  .priority-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .priority-opt {
    flex: 1; min-width: 70px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1.5px solid var(--panel-border);
    border-radius: 10px; padding: 8px 6px;
    cursor: pointer; font-size: 12.5px; color: var(--text-dim);
    background: var(--surface-2);
  }
  .priority-opt.active { color: #fff; border-color: transparent; font-weight: 700; }
  .priority-dot { width: 9px; height: 9px; border-radius: 50%; }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--panel-border);
    color: var(--text-dim); padding: 9px 16px; border-radius: 10px;
    cursor: pointer; font-family: inherit; font-size: 13.5px;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .btn-danger {
    background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4);
    color: #ff8787; padding: 9px 16px; border-radius: 10px;
    cursor: pointer; font-family: inherit; font-size: 13.5px;
  }
  .btn-danger:hover { background: rgba(239,68,68,.2); }

  /* ---------- Batch task modal ---------- */
  .batch-modal { width: min(620px, 95vw); }
  .batch-slides { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
  .batch-slide {
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px;
    background: var(--surface-2);
    position: relative;
  }
  .batch-slide-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .batch-slide-header span { font-size: 13px; font-weight: 700; color: var(--text-dim); }
  .slide-remove {
    background: transparent; border: none; color: var(--text-dim);
    font-size: 18px; line-height: 1; cursor: pointer;
    padding: 2px 8px; border-radius: 6px; font-family: inherit;
  }
  .slide-remove:hover { color: #ff8787; background: rgba(239,68,68,.12); }
  .add-slide-btn {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1.5px dashed var(--panel-border); border-radius: 12px;
    padding: 12px; background: transparent; color: var(--text-dim);
    cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700;
    margin-bottom: 14px;
  }
  .add-slide-btn:hover { border-color: var(--accent); color: var(--text); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .toolbar { padding: 10px 14px; gap: 8px; }
    .brand h1 { font-size: 15px; }
    .brand span { display: none; }
    .brand-logo { width: 28px; height: 28px; }
    .toolbar-actions { gap: 8px; }
    .legend { display: none; }
    .toggle { font-size: 11.5px; padding: 5px 8px; }
    .lang-toggle, .theme-toggle, .stats-toggle-btn { width: 32px; height: 32px; }
    .btn-secondary, .btn-primary { padding: 8px 12px; font-size: 12.5px; }
    .sort-tabs { padding: 8px 14px; gap: 4px; }
    .sort-tab { padding: 6px 10px; font-size: 11.5px; }
    .reset-tab { margin-inline-start: 0; }
    .modal { padding: 18px 16px; }
    .field-row { flex-direction: column; }
    .batch-modal { width: 94vw; }
  }
</style>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

const STORAGE_KEY = 'davayer-davayer-tasks-v1';
const THEME_KEY = 'davayer-davayer-theme';
const LANG_KEY = 'davayer-davayer-lang';
const MANUAL_POS_KEY = 'davayer-davayer-manual-pos';

const PRIORITY = {

  important:     { color: '#facc15' },
  veryImportant: { color: '#fb923c' },
  urgent:        { color: '#ef4444' },

const PRIORITY_ORDER = ['normal', 'important', 'veryImportant', 'urgent'];

const STRINGS = {

  en: {

    emptyHint: 'Tap "+ New task" to add your first one',
    axisOverdue: '⬆ Overdue / old date',
    axisFuture: '⬇ Still coming up',
    todayLabel: 'Today',
    afterTodayLabel: 'Coming up after today',
    sortByDate: 'Date',
    sortByDuration: 'Duration',
    sortByPriority: 'Priority',
    resetLayout: 'Reset layout',
    statsTitle: 'Your progress',
    statsToday: 'Today',
    statsWeek: 'This week',
    statsMonth: 'This month',
    statsAllTime: 'All time',
    statsUnit: 'pts',
    statsTasksUnit: 'tasks',
    fieldName: 'Task name',
    fieldNamePlaceholder: 'e.g. Prepare client presentation',
    fieldDescription: 'Description',
    fieldDescriptionPlaceholder: 'Extra details about the task...',
    fieldDeadline: 'Deadline date & time',
    fieldDuration: 'Estimated time to finish',
    hoursLabel: 'Hours',
    minutesLabel: 'Minutes',
    fieldPriority: 'Priority',
    formTitleCreate: 'New task',
    formTitleEdit: 'Edit task',
    btnCancel: 'Cancel',
    btnDelete: 'Delete',
    btnMarkDone: 'Mark done',
    btnUndoDone: 'Undo done',
    btnSaveCreate: 'Add task',
    btnSaveEdit: 'Save',
    batchTitle: 'Add a batch of tasks',
    batchSlideLabel: (i) => `Task ${i}`,
    addSlideBtn: '+ Add another task',
    saveAllBtn: (n) => `Save all (${n})`,
  },
};

const MIN_RADIUS = 52;
const MAX_RADIUS = 124;

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function loadTasks() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveTasks(tasks) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function loadManualPositions() {
  try {
    const raw = localStorage.getItem(MANUAL_POS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
function saveManualPositions(positions) {
  localStorage.setItem(MANUAL_POS_KEY, JSON.stringify(positions));
}

function loadCompletions() {
  try {
    const raw = localStorage.getItem(COMPLETIONS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveCompletions(completions) {
  localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(completions));
}

function daysUntil(dueDateIso) {
  const diffMs = new Date(dueDateIso).getTime() - Date.now();
  return diffMs / 86400000;
}

function dayKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDate(iso, lang) {
  try {
    return new Intl.DateTimeFormat(STRINGS[lang].dateLocale, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
  } catch (e) {
    return iso;
  }
}

function formatDateShort(iso) {
  try {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) {
    return iso;
  }
}

function hoursToHM(totalHours) {
  const totalMinutes = Math.round((Number(totalHours) || 0) * 60);
  return { h: Math.floor(totalMinutes / 60), m: totalMinutes % 60 };
}
function hmToHours(h, m) {
  return (Number(h) || 0) + (Number(m) || 0) / 60;
}
function formatDuration(totalHours, lang) {
  const { h, m } = hoursToHM(totalHours);
  if (lang === 'en') {
    if (h > 0 && m > 0) return `${h}h ${m}m`;
    if (h > 0) return `${h}h`;
    return `${m}m`;
  }
  if (h > 0 && m > 0) return `${h} س ${m} د`;
  if (h > 0) return `${h} س`;
  return `${m} د`;
}

function isOverdue(task) {
  return !task.completed && daysUntil(task.dueDate) < 0;
}

/* ---------------- Bubble field (physics + rendering) ---------------- */

const CLICK_DELAY_MS = 260;
const POP_DURATION_MS = 380;

const DRAG_THRESHOLD_PX = 6;

function BubbleField({ tasks, onSelect, onPop, lang, sortKeys, manualPositions, onManualMove }) {
  const s = STRINGS[lang];
  const containerRef = useRef(null);
  const nodesRef = useRef([]);
  const simRef = useRef(null);
  const elRefs = useRef({});
  const clickTimerRef = useRef(null);
  const dragStateRef = useRef(null);
  const [size, setSize] = useState({ w: 800, h: 600 });
  const [poppingIds, setPoppingIds] = useState(() => new Set());

  useEffect(() => () => {
    if (clickTimerRef.current) clearTimeout(clickTimerRef.current.timer);
  }, []);

  function handleBubbleClick(id) {
    if (clickTimerRef.current && clickTimerRef.current.id === id) {
      clearTimeout(clickTimerRef.current.timer);
      clickTimerRef.current = null;
      setPoppingIds(prev => new Set(prev).add(id));
      setTimeout(() => {
        onPop(id);
        setPoppingIds(prev => {
          const next = new Set(prev);
          next.delete(id);
          return next;
        });
      }, POP_DURATION_MS);
    } else {
      if (clickTimerRef.current) clearTimeout(clickTimerRef.current.timer);
      const timer = setTimeout(() => {
        clickTimerRef.current = null;
        onSelect(id);
      }, CLICK_DELAY_MS);
      clickTimerRef.current = { id, timer };
    }
  }

  function handlePointerDown(e, id) {
    const node = nodesRef.current.find(n => n.id === id);
    if (!node) return;
    dragStateRef.current = {
      id,
      startClientX: e.clientX,
      startClientY: e.clientY,
      startNodeX: node.x,
      startNodeY: node.y,
      dragging: false,
    };
    e.currentTarget.setPointerCapture(e.pointerId);
  }

  function handlePointerMove(e, id) {
    const ds = dragStateRef.current;
    if (!ds || ds.id !== id) return;
    const dx = e.clientX - ds.startClientX;
    const dy = e.clientY - ds.startClientY;
    if (!ds.dragging && Math.hypot(dx, dy) > DRAG_THRESHOLD_PX) {
      ds.dragging = true;
      if (clickTimerRef.current) { clearTimeout(clickTimerRef.current.timer); clickTimerRef.current = null; }
      if (simRef.current) simRef.current.alphaTarget(0.3).restart();
    }
    if (ds.dragging) {
      const node = nodesRef.current.find(n => n.id === id);
      if (node) {
        node.fx = ds.startNodeX + dx;
        node.fy = ds.startNodeY + dy;
      }
    }
  }

  function handlePointerUp(e, id) {
    const ds = dragStateRef.current;
    dragStateRef.current = null;
    if (!ds || ds.id !== id) return;
    if (ds.dragging) {
      const node = nodesRef.current.find(n => n.id === id);
      if (simRef.current) simRef.current.alphaTarget(0.05);
      if (node) {
        const finalX = node.fx, finalY = node.fy;
        node.fx = null;
        node.fy = null;
        onManualMove(id, { x: finalX, y: finalY });
      }
    } else {
      handleBubbleClick(id);
    }
  }

  // track container size
  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const ro = new ResizeObserver(entries => {
      for (const entry of entries) {
        const { width, height } = entry.contentRect;
        setSize({ w: width, h: height });
      }
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  const radiusScale = useMemo(() => {
    const hours = tasks.map(t => Math.max(0.1, Number(t.estimatedHours) || 1));
    const min = Math.min(...hours, 1);
    const max = Math.max(...hours, 1);
    return (h) => {
      const hv = Math.max(0.1, Number(h) || 1);
      if (max === min) return (MIN_RADIUS + MAX_RADIUS) / 2;
      const t = (hv - min) / (max - min);
      return MIN_RADIUS + Math.sqrt(t) * (MAX_RADIUS - MIN_RADIUS);
    };
  }, [tasks]);

  // Pack same-day tasks side by side (filling the row before wrapping),
  // oldest day's row on top, each following day's row below it.
  const { layoutById, contentHeight, todayY, tomorrowY } = useMemo(() => {
    const topPad = 90, bottomPad = 70, gap = 14, groupGap = 36;
    const width = Math.max(100, size.w);
    const rtl = STRINGS[lang].dir === 'rtl';

    const groups = new Map();
    for (const t of tasks) {
      const key = dayKey(t.dueDate);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    }
    // Order tasks within each same-day group by the active criteria, in the
    // exact precedence the user picked them in (first picked = primary key).
    const compareByKey = (key, a, b) => {
      if (key === 'duration') return a.estimatedHours - b.estimatedHours;
      if (key === 'priority') return PRIORITY_ORDER.indexOf(b.priority) - PRIORITY_ORDER.indexOf(a.priority);
      return new Date(a.dueDate) - new Date(b.dueDate);
    };
    const withinGroupCompare = (a, b) => {
      for (const key of sortKeys) {
        const c = compareByKey(key, a, b);
        if (c !== 0) return c;
      }
      return 0;
    };
    for (const list of groups.values()) list.sort(withinGroupCompare);
    const sortedKeys = Array.from(groups.keys()).sort();
    const todayK = dayKey(new Date().toISOString());
    const tomorrowK = dayKey(new Date(Date.now() + 86400000).toISOString());

    const positions = new Map();
    let cursorY = topPad;
    let todayLineY = null;
    let tomorrowLineY = null;

    for (const key of sortedKeys) {
      if (todayLineY === null && key >= todayK) {
        todayLineY = cursorY - groupGap / 2;
      }
      if (tomorrowLineY === null && key >= tomorrowK) {
        tomorrowLineY = cursorY - groupGap / 2;
      }
      let cursorX = rtl ? width : 0;
      let rowMaxDiameter = 0;
      for (const t of groups.get(key)) {
        const r = radiusScale(t.estimatedHours);
        const d = r * 2;
        if (rtl) {
          if (cursorX !== width && cursorX - d < 0) {
            cursorY += rowMaxDiameter + gap;
            cursorX = width;
            rowMaxDiameter = 0;
          }
          positions.set(t.id, { x: cursorX - r, y: cursorY + r, r });
          cursorX -= d + gap;
        } else {
          if (cursorX !== 0 && cursorX + d > width) {
            cursorY += rowMaxDiameter + gap;
            cursorX = 0;
            rowMaxDiameter = 0;
          }
          positions.set(t.id, { x: cursorX + r, y: cursorY + r, r });
          cursorX += d + gap;
        }
        rowMaxDiameter = Math.max(rowMaxDiameter, d);
      }
      cursorY += rowMaxDiameter + groupGap;
    }
    if (todayLineY === null) todayLineY = cursorY - groupGap / 2;
    if (tomorrowLineY === null) tomorrowLineY = cursorY - groupGap / 2;

    // Manual drag overrides win over the automatic packed position, but keep
    // riding on the same radius so sizing stays consistent with duration.
    if (manualPositions) {
      for (const id in manualPositions) {
        const existing = positions.get(id);
        if (existing) positions.set(id, { x: manualPositions[id].x, y: manualPositions[id].y, r: existing.r });
      }
    }

    return {
      layoutById: positions,
      contentHeight: Math.max(size.h, cursorY + bottomPad),
      todayY: todayLineY,
      tomorrowY: tomorrowLineY,
    };
  }, [tasks, size.w, size.h, radiusScale, lang, sortKeys, manualPositions]);

  // (re)build simulation whenever the task list, layout, or canvas size changes
  useEffect(() => {
    const w = size.w;
    const h = contentHeight;
    const prevById = new Map(nodesRef.current.map(n => [n.id, n]));

    const nodes = tasks.map(t => {
      const prev = prevById.get(t.id);
      const slot = layoutById.get(t.id);
      if (prev) {
        prev.r = slot.r;
        prev.task = t;
        // Snap straight to the new slot when the layout shifts (task added/
        // removed/edited) instead of waiting on the anchor force — otherwise
        // an edit can take a very long time to visibly settle.
        if (prev.gx !== slot.x || prev.gy !== slot.y) {
          prev.x = slot.x;
          prev.y = slot.y;
        }
        prev.gx = slot.x;
        prev.gy = slot.y;
        return prev;
      }
      return {
        id: t.id,
        task: t,
        r: slot.r,
        x: slot.x,
        y: slot.y,
        vx: 0,
        vy: 0,
        gx: slot.x,
        gy: slot.y,
      };
    });
    nodesRef.current = nodes;

    // Reflect node state in the DOM immediately, so sizing/position doesn't
    // depend on an animation frame having ticked yet (e.g. backgrounded tab).
    for (const n of nodes) {
      const el = elRefs.current[n.id];
      if (el) {
        const d = n.r * 2;
        el.style.width = d + 'px';
        el.style.height = d + 'px';
        el.style.transform = `translate(${n.x - n.r}px, ${n.y - n.r}px)`;
      }
    }

    if (simRef.current) simRef.current.stop();

    const sim = d3.forceSimulation(nodes)
      .alphaDecay(0)
      .alphaTarget(0.05)
      .velocityDecay(0.3)
      .force('x', d3.forceX(d => d.gx).strength(0.4))
      .force('y', d3.forceY(d => d.gy).strength(0.4))
      .force('collide', d3.forceCollide(d => d.r + 4).strength(0.9).iterations(2))
      .on('tick', () => {
        for (const n of nodesRef.current) {
          n.x = Math.max(n.r, Math.min(w - n.r, n.x));
          n.y = Math.max(n.r + 60, Math.min(h - n.r - 10, n.y));
          const el = elRefs.current[n.id];
          if (el) {
            const d = n.r * 2;
            el.style.width = d + 'px';
            el.style.height = d + 'px';
            el.style.transform = `translate(${n.x - n.r}px, ${n.y - n.r}px)`;
          }
        }
      });

    simRef.current = sim;
    return () => sim.stop();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tasks, size, radiusScale, layoutById, contentHeight]);

  return (
    <div className="field-wrap" ref={containerRef}>
      {tasks.length === 0 && (
        <div className="empty-state">
          <b>{s.emptyTitle}</b>
          <span>{s.emptyHint}</span>
        </div>
      )}
      <div className="axis-hint-top"><span>{s.axisOverdue}</span></div>
      <div className="bubble-canvas" style={{ height: contentHeight }}>
        {tasks.length > 0 && (
          <div className="today-line" style={{ top: todayY }}>
            <span className="today-line-label">{s.todayLabel}</span>
          </div>
        )}
        {tasks.length > 0 && (
          <div className="today-line tomorrow-line" style={{ top: tomorrowY }}>
            <span className="today-line-label tomorrow-line-label">{s.afterTodayLabel}</span>
          </div>
        )}
        {tasks.map(t => {
          const overdue = isOverdue(t);
          const meta = PRIORITY[t.priority] || PRIORITY.normal;
          const completedShown = t.completed;
          const style = completedShown
            ? {
                background: '#ffffff',
                border: '3px dashed #22c55e',
                boxShadow: '0 0 0 3px rgba(255,255,255,0.06)',
              }
            : {
                background: meta.color,
                border: '1px solid rgba(255,255,255,0.35)',
                boxShadow: `0 0 26px 2px ${meta.color}66`,
              };
          return (
            <div
              key={t.id}
              ref={el => { if (el) elRefs.current[t.id] = el; }}
              className="bubble"
              title={t.title}
            >
              <div
                className={'bubble-inner' + (completedShown ? ' completed' : '') + (overdue ? ' overdue-ring' : '') + (poppingIds.has(t.id) ? ' popping' : '')}
                style={style}
                onPointerDown={(e) => handlePointerDown(e, t.id)}
                onPointerMove={(e) => handlePointerMove(e, t.id)}
                onPointerUp={(e) => handlePointerUp(e, t.id)}
              >
                <div className="bubble-label">
                  <div className="bubble-title">{t.title}</div>
                  <div className="bubble-meta">{formatDateShort(t.dueDate)}</div>
                  <div className="bubble-meta">{formatDuration(t.estimatedHours, lang)}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="axis-hint-bottom"><span>{s.axisFuture}</span></div>
    </div>
  );
}

/* ---------------- Task form modal (create / edit) ---------------- */

function TaskFormModal({ initial, onCancel, onSave, onDelete, onToggleComplete, lang }) {
  const s = STRINGS[lang];
  const [title, setTitle] = useState(initial?.title || '');
  const [description, setDescription] = useState(initial?.description || '');
  const [dueDate, setDueDate] = useState(initial?.dueDate ? toLocalInputValue(initial.dueDate) : defaultDueLocal());
  const initialHM = hoursToHM(initial?.estimatedHours ?? 1);
  const [durationHours, setDurationHours] = useState(initialHM.h);
  const [durationMinutes, setDurationMinutes] = useState(initialHM.m);
  const [priority, setPriority] = useState(initial?.priority || 'normal');
  const titleRef = useRef(null);

  useEffect(() => { titleRef.current?.focus(); }, []);

  function toLocalInputValue(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function defaultDueLocal() {
    const d = new Date(Date.now() + 24 * 3600 * 1000);
    return toLocalInputValue(d.toISOString());
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!title.trim() || !dueDate) return;
    const totalHours = hmToHours(durationHours, durationMinutes);
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      description: description.trim(),
      dueDate: new Date(dueDate).toISOString(),
      estimatedHours: Math.max(1 / 60, totalHours),
      priority,
      completed: initial?.completed || false,
      completedAt: initial?.completedAt || null,
    });
  }

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <form className="modal" onSubmit={handleSubmit}>
        <h2>{initial ? s.formTitleEdit : s.formTitleCreate}</h2>

        <div className="field">
          <label>{s.fieldName}</label>
          <input ref={titleRef} value={title} onChange={e => setTitle(e.target.value)} placeholder={s.fieldNamePlaceholder} required />
        </div>

        <div className="field">
          <label>{s.fieldDescription}</label>
          <textarea value={description} onChange={e => setDescription(e.target.value)} placeholder={s.fieldDescriptionPlaceholder} />
        </div>

        <div className="field">
          <label>{s.fieldDeadline}</label>
          <input type="datetime-local" value={dueDate} onChange={e => setDueDate(e.target.value)} required />
        </div>

        <div className="field">
          <label>{s.fieldDuration}</label>
          <div className="field-row">
            <div className="field">
              <input type="number" min="0" step="1" value={durationHours} onChange={e => setDurationHours(e.target.value)} placeholder={s.hoursLabel} required />
              <span className="field-hint">{s.hoursLabel}</span>
            </div>
            <div className="field">
              <input type="number" min="0" max="59" step="5" value={durationMinutes} onChange={e => setDurationMinutes(e.target.value)} placeholder={s.minutesLabel} required />
              <span className="field-hint">{s.minutesLabel}</span>
            </div>
          </div>
        </div>

        <div className="field">
          <label>{s.fieldPriority}</label>
          <div className="priority-picker">
            {PRIORITY_ORDER.map(key => (
              <div
                key={key}
                className={'priority-opt' + (priority === key ? ' active' : '')}
                style={priority === key ? { background: PRIORITY[key].color } : {}}
                onClick={() => setPriority(key)}
              >
                <span className="priority-dot" style={{ background: PRIORITY[key].color }} />
                {s.priority[key]}
              </div>
            ))}
          </div>
        </div>

        <div className="modal-actions">
          {initial && (
            <button type="button" className="btn-danger" onClick={() => onDelete(initial.id)}>{s.btnDelete}</button>
          )}
          {initial && (
            <button type="button" className="btn-ghost" onClick={() => onToggleComplete(initial.id)}>
              {initial.completed ? s.btnUndoDone : s.btnMarkDone}
            </button>
          )}
          <button type="button" className="btn-ghost" onClick={onCancel}>{s.btnCancel}</button>
          <button type="submit" className="btn-primary">{initial ? s.btnSaveEdit : s.btnSaveCreate}</button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Batch task modal (multiple tasks at once) ---------------- */

function defaultDueLocalGlobal() {
  const d = new Date(Date.now() + 24 * 3600 * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function emptyDraft() {
  return {
    key: uid(),
    title: '',
    description: '',
    dueDate: defaultDueLocalGlobal(),
    durationHours: 1,
    durationMinutes: 0,
    priority: 'normal',
  };
}

function BatchTaskModal({ onCancel, onSaveAll, lang }) {
  const s = STRINGS[lang];
  const [drafts, setDrafts] = useState(() => [emptyDraft()]);

  function updateDraft(key, patch) {
    setDrafts(prev => prev.map(d => d.key === key ? { ...d, ...patch } : d));
  }
  function addSlide() {
    setDrafts(prev => [...prev, emptyDraft()]);
  }
  function removeSlide(key) {
    setDrafts(prev => prev.length > 1 ? prev.filter(d => d.key !== key) : prev);
  }

  function handleSaveAll() {
    const valid = drafts.filter(d => d.title.trim() && d.dueDate);
    if (valid.length === 0) return;
    const newTasks = valid.map(d => ({
      id: uid(),
      title: d.title.trim(),
      description: d.description.trim(),
      dueDate: new Date(d.dueDate).toISOString(),
      estimatedHours: Math.max(1 / 60, hmToHours(d.durationHours, d.durationMinutes)),
      priority: d.priority,
      completed: false,
      completedAt: null,
    }));
    onSaveAll(newTasks);
  }

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="modal batch-modal">
        <h2>{s.batchTitle}</h2>

        <div className="batch-slides">
          {drafts.map((d, i) => (
            <div className="batch-slide" key={d.key}>
              <div className="batch-slide-header">
                <span>{s.batchSlideLabel(i + 1)}</span>
                {drafts.length > 1 && (
                  <button type="button" className="slide-remove" onClick={() => removeSlide(d.key)}>×</button>
                )}
              </div>

              <div className="field">
                <label>{s.fieldName}</label>
                <input
                  value={d.title}
                  onChange={e => updateDraft(d.key, { title: e.target.value })}
                  placeholder={s.fieldNamePlaceholder}
                />
              </div>

              <div className="field">
                <label>{s.fieldDescription}</label>
                <textarea
                  value={d.description}
                  onChange={e => updateDraft(d.key, { description: e.target.value })}
                  placeholder={s.fieldDescriptionPlaceholder}
                />
              </div>

              <div className="field">
                <label>{s.fieldDeadline}</label>
                <input
                  type="datetime-local"
                  value={d.dueDate}
                  onChange={e => updateDraft(d.key, { dueDate: e.target.value })}
                />
              </div>

              <div className="field">
                <label>{s.fieldDuration}</label>
                <div className="field-row">
                  <div className="field">
                    <input type="number" min="0" step="1" value={d.durationHours} onChange={e => updateDraft(d.key, { durationHours: e.target.value })} placeholder={s.hoursLabel} />
                    <span className="field-hint">{s.hoursLabel}</span>
                  </div>
                  <div className="field">
                    <input type="number" min="0" max="59" step="5" value={d.durationMinutes} onChange={e => updateDraft(d.key, { durationMinutes: e.target.value })} placeholder={s.minutesLabel} />
                    <span className="field-hint">{s.minutesLabel}</span>
                  </div>
                </div>
              </div>

              <div className="field">
                <label>{s.fieldPriority}</label>
                <div className="priority-picker">
                  {PRIORITY_ORDER.map(key => (
                    <div
                      key={key}
                      className={'priority-opt' + (d.priority === key ? ' active' : '')}
                      style={d.priority === key ? { background: PRIORITY[key].color } : {}}
                      onClick={() => updateDraft(d.key, { priority: key })}
                    >
                      <span className="priority-dot" style={{ background: PRIORITY[key].color }} />
                      {s.priority[key]}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>

        <button type="button" className="add-slide-btn" onClick={addSlide}>{s.addSlideBtn}</button>

        <div className="modal-actions">
          <button type="button" className="btn-ghost" onClick={onCancel}>{s.btnCancel}</button>
          <button type="button" className="btn-primary" onClick={handleSaveAll}>{s.saveAllBtn(drafts.length)}</button>
        </div>
      </div>
    </div>
  );
}

function StatsDrawer({ stats, lang, onClose }) {
  const s = STRINGS[lang];
  const rows = [
    [s.statsToday, stats.today],
    [s.statsWeek, stats.week],
    [s.statsMonth, stats.month],
    [s.statsAllTime, stats.allTime],
  ];
  return (
    <div className="stats-drawer-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="stats-drawer">
        <div className="stats-drawer-header">
          <div className="stats-drawer-title"><TrophyIcon />{s.statsTitle}</div>
          <button className="stats-drawer-close" onClick={onClose}>×</button>
        </div>
        {rows.map(([label, entry]) => (
          <div className="stats-card" key={label}>
            <div className="stats-card-label">{label}</div>
            <div className="stats-card-row">
              <span className="stats-card-points">{entry.points.toLocaleString()} <small>{s.statsUnit}</small></span>
              <span className="stats-card-count">{entry.count} <b>{s.statsTasksUnit}</b></span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */

function App() {
  const [tasks, setTasks] = useState(loadTasks);
  const [showCompleted, setShowCompleted] = useState(false);
  const [formState, setFormState] = useState(null); // null | 'create' | taskId
  const [batchOpen, setBatchOpen] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || 'dark');
  const [lang, setLang] = useState(() => localStorage.getItem(LANG_KEY) || 'ar');
  const [sortKeys, setSortKeys] = useState(['date']); // order = precedence, e.g. ['date','duration']
  const [manualPositions, setManualPositions] = useState(loadManualPositions);
  const [completions, setCompletions] = useState(loadCompletions);
  const [statsOpen, setStatsOpen] = useState(false);

  function toggleSortKey(key) {
    setSortKeys(prev => {
      if (prev.includes(key)) {
        // Never let the chain go empty — keep at least one active criterion.
        if (prev.length === 1) return prev;
        return prev.filter(k => k !== key);
      }
      return [...prev, key];
    });
  }

  function handleManualMove(id, pos) {
    setManualPositions(prev => ({ ...prev, [id]: pos }));
  }
  function resetLayout() {
    setManualPositions({});
  }

  const s = STRINGS[lang];

  useEffect(() => { saveTasks(tasks); }, [tasks]);
  useEffect(() => { saveManualPositions(manualPositions); }, [manualPositions]);
  useEffect(() => { saveCompletions(completions); }, [completions]);

  useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    localStorage.setItem(THEME_KEY, theme);
  }, [theme]);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = STRINGS[lang].dir;
    localStorage.setItem(LANG_KEY, lang);
  }, [lang]);

  const visibleTasks = useMemo(
    () => showCompleted ? tasks : tasks.filter(t => !t.completed),
    [tasks, showCompleted]
  );

  function upsertTask(task) {
    setTasks(prev => {
      const exists = prev.some(t => t.id === task.id);
      return exists ? prev.map(t => t.id === task.id ? task : t) : [...prev, task];
    });
    setFormState(null);
  }
  function deleteTask(id) {
    setTasks(prev => prev.filter(t => t.id !== id));
    setFormState(null);
  }
  function toggleComplete(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    const nowCompleted = !task.completed;
    setTasks(prev => prev.map(t => t.id === id
      ? { ...t, completed: nowCompleted, completedAt: nowCompleted ? new Date().toISOString() : null }
      : t));
    setCompletions(prev => {
      const withoutThis = prev.filter(c => c.taskId !== id);
      if (!nowCompleted) return withoutThis;
      return [...withoutThis, {
        taskId: id,
        minutes: Math.max(1, Math.round((Number(task.estimatedHours) || 0) * 60)),
        completedAt: new Date().toISOString(),
      }];
    });
    setFormState(null);
  }

  const stats = useMemo(() => {
    const now = new Date();
    const todayKey = dayKey(now.toISOString());
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
    const today = { points: 0, count: 0 };
    const week = { points: 0, count: 0 };
    const month = { points: 0, count: 0 };
    const allTime = { points: 0, count: 0 };
    for (const c of completions) {
      const d = new Date(c.completedAt);
      allTime.points += c.minutes; allTime.count++;
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) { month.points += c.minutes; month.count++; }
      if (d >= weekStart) { week.points += c.minutes; week.count++; }
      if (dayKey(c.completedAt) === todayKey) { today.points += c.minutes; today.count++; }
    }
    return { today, week, month, allTime };
  }, [completions]);

  const editingTask = typeof formState === 'string' && formState !== 'create'
    ? tasks.find(t => t.id === formState)
    : null;

  return (
    <div className="app">
      <div className="toolbar">
        <div className="brand">
          <BubbleLogo className="brand-logo" />
          <div>
            <h1>{s.appName}</h1>
            <span>{s.tagline}</span>
          </div>
        </div>

        <div className="toolbar-actions">
          <div className="legend">
            {PRIORITY_ORDER.map(key => (
              <div className="legend-item" key={key}>
                <span className="legend-swatch" style={{ background: PRIORITY[key].color }} />
                {s.priority[key]}
              </div>
            ))}
          </div>

          <label className="toggle">
            <input type="checkbox" checked={showCompleted} onChange={e => setShowCompleted(e.target.checked)} />
            {s.showCompleted}
          </label>

          <button
            className="lang-toggle"
            onClick={() => setLang(l => l === 'ar' ? 'en' : 'ar')}
            title={lang === 'ar' ? 'English' : 'العربية'}
          >
            {s.langToggle}
          </button>

          <button
            className="theme-toggle"
            onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
            title={theme === 'dark' ? s.themeToLight : s.themeToDark}
          >
            <ThemeIcon theme={theme} />
          </button>

          <button className="stats-toggle-btn" onClick={() => setStatsOpen(true)} title={s.statsTitle}>
            <TrophyIcon />
          </button>

          <button className="btn-secondary" onClick={() => setBatchOpen(true)}>{s.addBatch}</button>
          <button className="btn-primary" onClick={() => setFormState('create')}>{s.addTask}</button>
        </div>
      </div>

      <div className="sort-tabs">
        {[
          ['date', s.sortByDate, <CalendarIcon key="i" />],
          ['duration', s.sortByDuration, <ClockIcon key="i" />],
          ['priority', s.sortByPriority, <FlagIcon key="i" />],
        ].map(([key, label, icon]) => {
          const order = sortKeys.indexOf(key);
          return (
            <button
              key={key}
              className={'sort-tab' + (order !== -1 ? ' active' : '')}
              onClick={() => toggleSortKey(key)}
            >
              {icon}{label}
              {order !== -1 && sortKeys.length > 1 && <span className="sort-tab-badge">{order + 1}</span>}
            </button>
          );
        })}
        <button className="sort-tab reset-tab" onClick={resetLayout} title={s.resetLayout}>
          <ResetIcon />{s.resetLayout}
        </button>
      </div>


      <BubbleField
        tasks={visibleTasks}
        onSelect={setFormState}
        onPop={toggleComplete}
        lang={lang}
        sortKeys={sortKeys}
        manualPositions={manualPositions}
        onManualMove={handleManualMove}
      />

      {formState && (
        <TaskFormModal
          initial={editingTask}
          onCancel={() => setFormState(null)}
          onSave={upsertTask}
          onDelete={deleteTask}
          onToggleComplete={toggleComplete}
          lang={lang}
        />
      )}

      {batchOpen && (
        <BatchTaskModal
          onCancel={() => setBatchOpen(false)}
          onSaveAll={(newTasks) => {
            setTasks(prev => [...prev, ...newTasks]);
            setBatchOpen(false);
          }}
          lang={lang}
        />
      )}

      {statsOpen && (
        <StatsDrawer stats={stats} lang={lang} onClose={() => setStatsOpen(false)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
